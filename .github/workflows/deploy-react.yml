# Deploy da Órbita (React + Vite) para o GitHub Pages.
#
# ESTADO (2026-10-04): publica em cada push para `main`, desde que a fonte do Pages esteja em
# «GitHub Actions». Nos ramos `orbita/**` só constrói — é a prova do build nos runners do GitHub,
# sem publicar nada (a tarefa `deploy` só corre no `main`).
#
# ATIVAR (o Daniel, por esta ordem):
#   1. Repo → Settings → Pages → «Build and deployment» → Source: «GitHub Actions», ANTES do push.
#      Com a fonte ainda em «Deploy from a branch», o push da Órbita para o `main` serviria o
#      index.html do Vite sem build, e o site ficaria partido.
#   2. O push para o `main` (a entrada da Órbita). Este workflow constrói e publica.
#   O login por password não redireciona, e o registo de contas está fechado: o Supabase não
#   precisa de mudanças para o novo endereço.
#
# REVERTER: ver `reversao/LEIA-ME.md` (ensaiado a 2026-10-04). Reverter o `main` NÃO chega: o
# Vanilla não tem workflow, e com a fonte em «GitHub Actions» o site continuaria a servir a Órbita.
# Primeiro o Vanilla no `main`, com o interruptor do service worker (`reversao/sw.js`); só depois a
# fonte volta a «Deploy from a branch». Pela ordem inversa, o site parte-se.
#
# NOTA (o sistema nunca mente): a app NÃO usa variáveis de ambiente. A URL e a anon key do Supabase
# estão em src/lib/supabase.js (a anon key é pública por desenho — o RLS protege os dados). Por isso
# o build corre sem segredos. O Three.js (src/vendor/) é empacotado pelo Vite no bundle.
#
# Node: as ações correm no motor Node 24 (as versões v5) e o build em Node 24. O GitHub tirou o
# Node 20 dos runners a 2026-09-23 (MELHORIAS.md, item 12).
#
# PORTÕES (fase 0.1, 2026-10-06 — SPEC v2, «Roadmap depois da publicação»): até aqui o workflow
# construía e publicava sem correr um único teste. Agora:
#   testes             → typecheck + testes de segurança e de toque (Chrome sem cabeça). O build
#                        depende deles: com um teste a falhar, nada se constrói nem se publica.
#                        Exige um MÍNIMO de testes passados, contados no TAP — um `node --test` cujo
#                        padrão não encontra ficheiros sai com 0 e 0 testes (provado a 06/10).
#   build              → depois do build, o fumo da Órbita sobre o `dist`, antes do upload.
#   verificar-destino  → só no `main`, depois do deploy: o mesmo fumo contra o site publicado.
#                        Falhar aqui não desfaz a publicação: avisa (corrida vermelha, email) e a
#                        reversão é a de `reversao/LEIA-ME.md`.
# Quando os testes mudarem de número a sério, o mínimo (TESTES_MINIMO) muda no mesmo commit.

name: Deploy React to Pages

on:
  push:
    branches: [main, 'orbita/**']   # main publica; orbita/** só constrói
  workflow_dispatch:                # e manualmente, no main

permissions:
  contents: read

# uma corrida de cada vez por ramo; não cancela um deploy a meio
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TESTES_MINIMO: 129   # segurança (86) + toque (43), contados a 2026-10-09
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes de segurança e de toque (Chrome sem cabeça)
        run: |
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/testes.tap" \
            "testes/seguranca/*.test.mjs" "testes/toque/*.test.mjs"
          n=$(grep -cE '^ok [0-9]+' "$RUNNER_TEMP/testes.tap" || true)
          echo "testes que passaram: $n (mínimo: $TESTES_MINIMO)"
          if [ "$n" -lt "$TESTES_MINIMO" ]; then
            echo "::error::só $n testes passaram e o mínimo é $TESTES_MINIMO — desapareceram testes?"
            exit 1
          fi

  build:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (Vite)
        run: npm run build   # base '/Sistema/' vem do vite.config.js

      - name: Hashes do dist (para comparar com o build local e com o destino)
        run: cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum

      - name: Fumo da Órbita sobre o dist (antes de publicar)
        run: node testes/fumo/orbita.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  verificar-destino:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5  # PLANTADO: controlo do W57, nunca entra no main

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'

      - name: Fumo da Órbita no site publicado
        run: node testes/fumo/orbita.mjs https://kamappa.github.io/Sistema/
